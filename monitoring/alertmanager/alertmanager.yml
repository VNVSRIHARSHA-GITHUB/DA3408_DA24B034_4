# Short timings so alerts show up within seconds in the demo.
route:
  receiver: "local-receiver"
  group_by: ["alertname", "severity"]
  group_wait: 5s
  group_interval: 5s
  repeat_interval: 1m

receivers:
  - name: "local-receiver"
    webhook_configs:
      - url: "http://localhost:5001/alert"   # tools/alert_receiver.py
        send_resolved: true

# A critical alert mutes the warning alert with the same name.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, instance]
