# Prometheus runs with network_mode: host, so "localhost" is the laptop.

global:
  scrape_interval: 1s       # scrape every target every second
  evaluation_interval: 1s   # evaluate rules every second

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

rule_files:
  - "rules.yml"

scrape_configs:
  - job_name: "node"          # machine metrics (node_exporter)
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: "python_app"    # the Streamlit captioning app
    static_configs:
      - targets: ["localhost:18000"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["localhost:9093"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
